<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="12" fill="url(#bg)"/>
  <!-- Tech Grid Background -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
  </g>
  <!-- Server Unit Graphic -->
  <rect x="100" y="80" width="200" height="140" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <line x1="100" y1="125" x2="300" y2="125" stroke="#334155" stroke-width="2"/>
  <line x1="100" y1="175" x2="300" y2="175" stroke="#334155" stroke-width="2"/>
  <!-- Status LEDs -->
  <circle cx="120" cy="103" r="5" fill="#10b981"/>
  <circle cx="135" cy="103" r="4" fill="#0ea5e9"/>
  <circle cx="150" cy="103" r="4" fill="#f59e0b"/>
  <circle cx="120" cy="150" r="5" fill="#10b981"/>
  <circle cx="135" cy="150" r="4" fill="#0ea5e9"/>
  <circle cx="120" cy="198" r="5" fill="#10b981"/>
  <!-- Drive Slots -->
  <rect x="180" y="93" width="20" height="20" rx="2" fill="#0f172a" stroke="#475569"/>
  <rect x="205" y="93" width="20" height="20" rx="2" fill="#0f172a" stroke="#475569"/>
  <rect x="230" y="93" width="20" height="20" rx="2" fill="#0f172a" stroke="#475569"/>
  <rect x="255" y="93" width="20" height="20" rx="2" fill="#0f172a" stroke="#475569"/>
  <rect x="180" y="140" width="20" height="20" rx="2" fill="#0f172a" stroke="#475569"/>
  <rect x="205" y="140" width="20" height="20" rx="2" fill="#0f172a" stroke="#475569"/>
  <rect x="230" y="140" width="20" height="20" rx="2" fill="#0f172a" stroke="#475569"/>
  <rect x="255" y="140" width="20" height="20" rx="2" fill="#0f172a" stroke="#475569"/>
  <text x="200" y="255" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle">TECHTAIL HARDWARE</text>
</svg>
