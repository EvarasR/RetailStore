<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="empty-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <circle cx="160" cy="110" r="70" fill="url(#empty-bg)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6"/>
  <!-- Magnifying Glass Icon -->
  <circle cx="150" cy="100" r="28" fill="none" stroke="#64748b" stroke-width="4"/>
  <line x1="170" y1="120" x2="195" y2="145" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <!-- Question mark inside glass -->
  <text x="150" y="108" font-family="sans-serif" font-size="24" font-weight="bold" fill="#38bdf8" text-anchor="middle">?</text>
  <!-- Small Server Rack behind -->
  <rect x="80" y="160" width="160" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="95" cy="180" r="4" fill="#ef4444"/>
  <circle cx="110" cy="180" r="4" fill="#f59e0b"/>
  <circle cx="125" cy="180" r="4" fill="#10b981"/>
</svg>
