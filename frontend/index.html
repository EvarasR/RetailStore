<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/techtail-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TechTail — Enterprise Tech Marketplace especializado en servidores, redes 10G, almacenamiento SAN y hardware corporativo garantizado." />
    <title>TechTail — Enterprise Tech Marketplace</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('techtail_theme');
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.setAttribute('data-theme', theme);
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
